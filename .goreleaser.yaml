# GoReleaser configuration — cross-compiled release binaries + checksums.
# https://goreleaser.com
version: 2

project_name: saltctl

before:
  hooks:
    - go mod tidy

builds:
  - id: saltctl
    main: .
    binary: saltctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - FEATURES.md
      - LICENSE

kos:
  - id: image
    build: saltctl
    base_image: gcr.io/distroless/static:nonroot
    repositories:
      - ghcr.io/gmgigi96/saltctl
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      - latest
    bare: true
    preserve_import_paths: false
    labels:
      org.opencontainers.image.source: "https://github.com/gmgigi96/saltctl"
      org.opencontainers.image.description: "CLI for Salt internet boxes (Salt Fiber Box / Arcadyan)"
      org.opencontainers.image.licenses: "MIT"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
